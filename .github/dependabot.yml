# Copy to .github/dependabot.yml (Python project locked with uv, built as a Docker image).
# Commit prefixes follow Conventional Commits so release-please can pick them up.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix"                  # runtime deps ship in the image -> patch release
      prefix-development: "chore"    # dev deps -> no release
      include: scope                 # fix(deps): ... / chore(deps-dev): ...
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"                   # ci(deps): ... -> no release
      include: scope

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "fix"                  # base image changes ship in the image -> patch release
      include: scope
